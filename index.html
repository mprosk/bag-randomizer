<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A randomized five-color palette composed from Lindquist bags."
    />
    <title>Lindquist Palette Study</title>
    <link rel="preconnect" href="https://cdn.shopify.com" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="https://lindquist-object.com" target="_blank" rel="noreferrer">
        LINDQUIST
      </a>
      <div class="header-actions">
        <button id="download-button" class="download-button" type="button">
          <span>Download</span>
          <span aria-hidden="true">↓</span>
        </button>
        <button
          id="shuffle-button"
          class="shuffle-button"
          type="button"
          aria-label="Randomize palette"
          title="Randomize palette"
        >
          <span class="button-icon" aria-hidden="true">↻</span>
        </button>
      </div>
      <span id="download-status" class="visually-hidden" aria-live="polite"></span>
    </header>

    <main>
      <section id="palette" class="palette" aria-live="polite" aria-label="Random bag palette"></section>
      <div
        id="swatch-resizer"
        class="swatch-resizer"
        role="separator"
        aria-label="Resize color swatches"
        aria-orientation="horizontal"
        aria-valuemin="80"
        aria-valuemax="360"
        aria-valuenow="180"
        tabindex="0"
      >
        <span aria-hidden="true"></span>
      </div>
      <section id="swatches" class="swatches" aria-label="Palette colors"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
